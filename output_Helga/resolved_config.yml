alpha:
  rarefaction_points: 25
  resample_depth: 50000
  resample_fraction_cap: 0.9
  resample_iterations: 100
composition:
  top_n_taxa: 15
  heatmap_rank: genus
  heatmap_transform: log10_relative
beta:
  distances:
  - bray
  - jaccard
  permutations: 999
  minimum_count: 1
  resampling:
    enabled: no
    iterations: 100
    depth_fraction_of_minimum: 0.75
shared_taxa:
  rank: species
  minimum_count: 1
  group_prevalence: 0.5
taxonomy:
  cache: D:/W/AAy_Amplicon/output_AAy/taxonomy_cache.json
  network_mode: cache_only
  unresolved_policy: warn
  email_env: NCBI_EMAIL
  api_key_env: NCBI_API_KEY
cli:
  validate_only: no
  keep_going: no
  overwrite: yes
  refresh_taxonomy: no
  modules: kreport
config_file: D:/W/AAy_Amplicon/config_helga.yml
