schema_version: 1
project_name: Helga_16SrRNA_NCBI
mode: single
seed: 42
input:
  abundance_table: D:/W/AAy_Amplicon/wf-16s_Helga16SrRNA/output/abundance_table_species.tsv
  params_json: D:/W/AAy_Amplicon/wf-16s_Helga16SrRNA/output/params.json
  tax_column: tax
  aggregate_columns: total
  assignments:
    Helga-16SrRNA-NCBI: D:/W/AAy_Amplicon/wf-16s_Helga16SrRNA/output/reads_assignments/Helga-16SrRNA-NCBI_lineages.minimap2.assignments.tsv
output:
  base_dir: D:/W/AAy_Amplicon/output_Helga
  dirs:
    qc: D:/W/AAy_Amplicon/output_Helga/01_QC
    alpha: D:/W/AAy_Amplicon/output_Helga/02_Alpha_Diversity
    beta: D:/W/AAy_Amplicon/output_Helga/03_Beta_Diversity
    composition: D:/W/AAy_Amplicon/output_Helga/04_Taxa_Composition
    ordination: D:/W/AAy_Amplicon/output_Helga/05_Ordination
    shared_taxa: D:/W/AAy_Amplicon/output_Helga/06_Shared_Taxa
    kreport: D:/W/AAy_Amplicon/output_Helga/07_Kreport
