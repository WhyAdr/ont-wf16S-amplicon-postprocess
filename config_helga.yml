schema_version: 1
project_name: "Helga_16SrRNA_NCBI"
mode: "single"
seed: 42

input:
  abundance_table: "wf-16s_Helga16SrRNA/output/abundance_table_species.tsv"
  metadata: null
  params_json: "wf-16s_Helga16SrRNA/output/params.json"
  wf16s_output_root: "wf-16s_Helga16SrRNA/output"
  tax_column: "tax"
  aggregate_columns: ["total"]
  include_samples: null
  assignments:
    Helga-16SrRNA-NCBI: "wf-16s_Helga16SrRNA/output/reads_assignments/Helga-16SrRNA-NCBI_lineages.minimap2.assignments.tsv"

output:
  base_dir: "output_Helga"

qc:
  display_min_length: 1200
  display_max_length: 1800
  target_min_length: null
  target_max_length: null

alpha:
  rarefaction_points: 25
  resample_depth: 50000
  resample_fraction_cap: 0.90
  resample_iterations: 100

composition:
  top_n_taxa: 15
  heatmap_rank: "genus"
  heatmap_transform: "log10_relative"

beta:
  distances: ["bray", "jaccard"]
  permutations: 999
  minimum_count: 1
  strata_column: null
  resampling:
    enabled: false
    iterations: 100
    depth_fraction_of_minimum: 0.75

shared_taxa:
  rank: "species"
  minimum_count: 1
  group_prevalence: 0.5

taxonomy:
  cache: "output_AAy/taxonomy_cache.json"
  network_mode: "cache_only"
  unresolved_policy: "warn"
  email_env: "NCBI_EMAIL"
  api_key_env: "NCBI_API_KEY"
