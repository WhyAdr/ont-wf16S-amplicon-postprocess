schema_version: 1
project_name: "synthetic_minimap2_bamstats"
mode: "single"
seed: 42

input:
  abundance_table: "abundance_table_species.tsv"
  metadata: null
  params_json: "params.json"
  wf16s_output_root: "."
  tax_column: "tax"
  aggregate_columns: ["total"]
  include_samples: null
  assignments:
    synthetic_minimap2: "reads_assignments/synthetic_minimap2_lineages.minimap2.assignments.tsv.gz"

output:
  base_dir: "output_synthetic_bamstats"

qc:
  display_min_length: 1200
  display_max_length: 1800
  target_min_length: 1200
  target_max_length: 1800

alpha:
  rarefaction_points: 5
  resample_depth: 1
  resample_fraction_cap: 1.0
  resample_iterations: 5

composition:
  top_n_taxa: 5
  heatmap_rank: "species"
  heatmap_transform: "log10_relative"

beta:
  distances: ["bray"]
  primary_distance: "bray"
  permutations: 99
  minimum_count: 1
  strata_column: null
  resampling:
    enabled: false
    iterations: 10
    depth_fraction_of_minimum: 0.75

shared_taxa:
  rank: "species"
  minimum_count: 1
  group_prevalence: 0.5

taxonomy:
  cache: "taxonomy_cache.json"
  network_mode: "cache_only"
  unresolved_policy: "warn"
  email_env: "NCBI_EMAIL"
  api_key_env: "NCBI_API_KEY"
