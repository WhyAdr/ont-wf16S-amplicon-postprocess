schema_version: 1
project_name: "synthetic_phylogenetic_alpha"
mode: "cohort"
seed: 42

input:
  abundance_table: "../synthetic_zero_classified_cohort/abundance_table_species.tsv"
  metadata: "metadata.tsv"
  params_json: "../synthetic_zero_classified_cohort/params.json"
  wf16s_output_root: "../synthetic_zero_classified_cohort"
  tax_column: "tax"
  aggregate_columns: ["total"]
  include_samples: ["S_valid_A", "S_valid_B"]
  assignments:
    S_valid_A: "../synthetic_zero_classified_cohort/reads_assignments/S_valid_A.assignments.tsv"
    S_valid_B: "../synthetic_zero_classified_cohort/reads_assignments/S_valid_B.assignments.tsv"
  phylogenetic_tree: "tree.nwk"
  phylogenetic_tip_map: "tip_map.tsv"

output:
  base_dir: "output_synthetic_phylogenetic"

alpha:
  rarefaction_points: 5
  resample_depth: 2
  resample_fraction_cap: 1.0
  resample_iterations: 5
  hill_orders: [0, 1, 2]
  renyi_orders: [1]

composition:
  top_n_taxa: 5
  stacked_bar_ranks: ["genus"]
  stacked_bar_max_taxa: 5
  stacked_bar_min_taxa: 1
  stacked_bar_min_mean_relative: 0
  heatmap_ranks: ["genus"]
  heatmap_top_n_taxa: 5
  heatmap_include_other: true
  heatmap_transform: "log10_relative"

taxonomy:
  cache: "../synthetic_zero_classified_cohort/taxonomy_cache.json"
  network_mode: "cache_only"
  unresolved_policy: "error"
  email_env: "NCBI_EMAIL"
  api_key_env: "NCBI_API_KEY"
