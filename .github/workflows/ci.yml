name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      WF16S_DIFF_BASE: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r: ['4.5.3']
        python: ['3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libglpk40

      - name: Restore locked R environment
        shell: bash
        run: |
          Rscript analysis/install_packages.R --restore

      - name: Parse R and Python sources
        shell: bash
        run: |
          Rscript -e "files <- list.files('analysis', pattern='[.]R$', recursive=TRUE, full.names=TRUE); invisible(lapply(files, parse))"
          python -m compileall -q analysis tests

      - name: Run unit and regression tests
        shell: bash
        run: |
          Rscript tests/testthat.R
          python -m unittest -v tests/test_krona_builder.py
          python -m unittest -v tests/test_ncbi_taxonomy.py tests/test_check_committed_whitespace.py

      - name: Validate without filesystem mutation
        shell: bash
        run: |
          test ! -e "ci validation output"
          Rscript analysis/00_run_pipeline.R --config config.yml --output-dir "ci validation output" --validate-only
          test ! -e "ci validation output"

      - name: Validate requested builtin Krona without filesystem mutation
        shell: bash
        run: |
          test ! -e "ci krona validation output"
          Rscript analysis/00_run_pipeline.R \
            --config config.yml \
            --output-dir "ci krona validation output" \
            --validate-only --krona
          test ! -e "ci krona validation output"
          git diff --exit-code

      - name: Run full release integration
        shell: bash
        run: |
          Rscript analysis/00_run_pipeline.R --config config.yml --output-dir "ci integration output" --krona
          Rscript tests/verify_release_run.R "ci integration output"
          Rscript analysis/00_run_pipeline.R --config tests/fixtures/synthetic_minimap2/config.yml --output-dir "ci bamstats output"
          Rscript tests/verify_release_run.R "ci bamstats output"

      - name: Check committed whitespace
        if: runner.os == 'Linux'
        shell: bash
        run: python tests/check_committed_whitespace.py

      - name: Check complete commit-range whitespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          base="${WF16S_DIFF_BASE:-}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "$base^{commit}" 2>/dev/null || \
             [[ "$base" == "$(git rev-parse HEAD)" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD

  faprotax:
    name: ${{ matrix.os }} / R 4.5.3 / Python 3.12 (FAPROTAX)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libglpk40

      - name: Restore locked R environment
        shell: bash
        run: |
          Rscript analysis/install_packages.R --restore

      - name: Run testthat with microeco installed
        shell: bash
        run: Rscript tests/testthat.R

      - name: Run pipeline and verify with FAPROTAX module
        shell: bash
        run: |
          Rscript analysis/00_run_pipeline.R --config config.yml --modules qc,alpha,beta,composition,ordination,shared,kreport,faprotax --output-dir "ci faprotax output"
          Rscript tests/verify_release_run.R "ci faprotax output"
