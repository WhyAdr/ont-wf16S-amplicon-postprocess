name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      WF16S_DIFF_BASE: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r: ['4.5.3']
        python: ['3.12']

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libglpk40

      - name: Restore locked R environment
        shell: bash
        run: |
          Rscript analysis/install_packages.R --restore

      - name: Parse R and Python sources
        shell: bash
        run: |
          Rscript -e "files <- list.files('analysis', pattern='[.]R$', recursive=TRUE, full.names=TRUE); invisible(lapply(files, parse))"
          python -m compileall -q analysis tests
          python tests/check_release_metadata.py

      - name: Check exact annotated tag metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python tests/check_release_metadata.py --require-tag "${GITHUB_REF_NAME}"

      - name: Run unit and regression tests
        shell: bash
        run: |
          Rscript tests/testthat.R
          python -m unittest -v tests/test_krona_builder.py
          python -m unittest -v tests/test_krona_correspondence.py
          python -m unittest -v tests/test_kraken_report_viewer.py
          python -m unittest -v tests/test_kraken_viewer_correspondence.py
          python -m unittest -v tests.test_taxonomy_sankey_renderer tests.test_taxonomy_sankey_correspondence
          node --test tests/test_taxonomy_sankey_client.mjs
          python -m unittest -v tests/test_ncbi_taxonomy.py tests/test_check_committed_whitespace.py

      - name: Validate without filesystem mutation
        shell: bash
        run: |
          test ! -e "ci validation output"
          Rscript analysis/00_run_pipeline.R --config config.yml --output-dir "ci validation output" --validate-only
          test ! -e "ci validation output"

      - name: Validate requested builtin Krona without filesystem mutation
        shell: bash
        run: |
          test ! -e "ci krona validation output"
          Rscript analysis/00_run_pipeline.R \
            --config config.yml \
            --output-dir "ci krona validation output" \
            --validate-only --krona
          test ! -e "ci krona validation output"
          git diff --exit-code

      - name: Validate requested Pavian integration without filesystem mutation
        shell: bash
        run: |
          test ! -e "ci pavian validation output"
          Rscript analysis/00_run_pipeline.R \
            --config config.yml \
            --output-dir "ci pavian validation output" \
            --validate-only --pavian
          test ! -e "ci pavian validation output"

      - name: Run full release integration
        shell: bash
        run: |
          Rscript analysis/00_run_pipeline.R --config config.yml --output-dir "ci integration output" --krona --pavian
          Rscript tests/verify_release_run.R "ci integration output"
          Rscript analysis/00_run_pipeline.R --config tests/fixtures/synthetic_minimap2/config.yml --output-dir "ci bamstats output" --pavian
          Rscript tests/verify_release_run.R "ci bamstats output"

      - name: Record canonical Sankey hashes for cross-OS comparison
        shell: bash
        run: >-
          python -c "from pathlib import Path; import hashlib; root=Path('ci integration output/07_Kreport/pavian/sankey'); files=sorted(root.glob('*.sankey.json')); assert files, 'no Sankey JSON artifacts'; Path('sankey-hashes.txt').write_text(''.join(f'{p.name}\t{hashlib.sha256(p.read_bytes()).hexdigest()}\t{p.stat().st_size}\n' for p in files), encoding='utf-8', newline='\n')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taxonomy-sankey-${{ matrix.os }}
          path: sankey-hashes.txt

      - name: Run zero-classified cohort release integration
        shell: bash
        run: |
          Rscript analysis/00_run_pipeline.R \
            --config tests/fixtures/synthetic_zero_classified_cohort/config.yml \
            --modules qc,composition,kreport \
            --output-dir "ci zero classified cohort output" \
            --krona --pavian
          Rscript tests/verify_release_run.R "ci zero classified cohort output"

      - name: Run phylogenetic alpha release integration
        shell: bash
        run: |
          Rscript analysis/00_run_pipeline.R \
            --config tests/fixtures/synthetic_phylogenetic/config.yml \
            --modules qc,alpha,composition,kreport \
            --output-dir "ci phylogenetic output" \
            --krona
          Rscript tests/verify_release_run.R "ci phylogenetic output"

      - name: Check committed whitespace
        if: runner.os == 'Linux'
        shell: bash
        run: python tests/check_committed_whitespace.py

      - name: Check complete commit-range whitespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          base="${WF16S_DIFF_BASE:-}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "$base^{commit}" 2>/dev/null || \
             [[ "$base" == "$(git rev-parse HEAD)" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD

  faprotax:
    name: ${{ matrix.os }} / R 4.5.3 / Python 3.12 (FAPROTAX)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libglpk40

      - name: Restore locked R environment
        shell: bash
        run: |
          Rscript analysis/install_packages.R --restore

      - name: Run testthat with microeco installed
        shell: bash
        run: Rscript tests/testthat.R

      - name: Run pipeline and verify with FAPROTAX module
        shell: bash
        run: |
          Rscript analysis/00_run_pipeline.R --config config.yml --modules qc,alpha,beta,composition,ordination,shared,kreport,faprotax --output-dir "ci faprotax output"
          Rscript tests/verify_release_run.R "ci faprotax output"

  sankey-reproducibility:
    name: cross-OS Sankey byte equality
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: sankey-artifacts
      - name: Compare canonical Sankey hashes
        shell: bash
        run: >-
          python -c "from pathlib import Path; files=sorted(Path('sankey-artifacts').glob('*/sankey-hashes.txt')); assert len(files)==2, files; data=[p.read_bytes() for p in files]; assert data[0]==data[1], f'cross-OS Sankey bytes differ: {files}'; print(data[0].decode('utf-8'), end='')"
